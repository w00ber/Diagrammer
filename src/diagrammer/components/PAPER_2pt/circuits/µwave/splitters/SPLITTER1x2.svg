<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 80 100">
  <defs>
    <style>
      .st0 {
        fill: #c66;
      }

      .st1, .st2, .st3 {
        fill: none;
        stroke: #000;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }

      .st1 {
        stroke-width: 2px;
      }

      .st2 {
        stroke-width: 2px;
      }

      .st3 {
        stroke-width: 2.7px;
      }
    </style>
  </defs>
  <g id="artwork">
    <rect class="st3" x="10" y="10" width="60" height="80" rx="4" ry="4"/>
    <line class="st1" x1="10" y1="50" x2="20" y2="50"/>
    <path class="st1" d="M20,50 C29,50 32,30 46,30 H70"/>
    <path class="st1" d="M20,50 C29,50 32,70 46,70 H70"/>
  </g>
  <g id="leads">
    <line id="lead:com" class="st2" x1="0" y1="50" x2="10" y2="50"/>
    <line id="lead:1" class="st2" x1="80" y1="30" x2="70" y2="30"/>
    <line id="lead:2" class="st2" x1="80" y1="70" x2="70" y2="70"/>
  </g>
  <g id="ports">
    <circle id="port:com" class="st0" cx="0" cy="50" r="3"/>
    <circle id="port:1" class="st0" cx="80" cy="30" r="3"/>
    <circle id="port:2" class="st0" cx="80" cy="70" r="3"/>
  </g>
</svg>
