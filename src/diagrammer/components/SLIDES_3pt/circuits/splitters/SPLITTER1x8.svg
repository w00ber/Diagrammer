<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 80 200">
  <defs>
    <style>
      .st0 {
        fill: #c66;
      }

      .st1, .st2, .st3 {
        fill: none;
        stroke: #000;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }

      .st1 {
        stroke-width: 2px;
      }

      .st2 {
        stroke-width: 3px;
      }

      .st3 {
        stroke-width: 2.7px;
      }
    </style>
  </defs>
  <g id="artwork">
