    <path class="st1" d="M20,100 C29,100 32,110 46,110 H70"/>
    <path class="st1" d="M20,100 C29,100 32,130 46,130 H70"/>
    <path class="st1" d="M20,100 C29,100 32,150 46,150 H70"/>
    <path class="st1" d="M20,100 C29,100 32,170 46,170 H70"/>
  </g>
  <g id="leads">
